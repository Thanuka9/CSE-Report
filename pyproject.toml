[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "cse-financial-data-platform"
version = "0.1.0"
description = "Auditable CSE quarterly financial-data ETL and Excel reporting pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "networkx>=3.4,<4",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "polars>=1.31,<2",
  "pyarrow>=17,<25",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "PyMuPDF>=1.25,<2",
  "rapidfuzz>=3.10,<4",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
browser = ["playwright>=1.47,<2"]
complex-pdf = ["docling>=2.50,<3"]
ocr = ["ocrmypdf>=16,<20", "pytesseract>=0.3.13,<1"]
semantic = ["sentence-transformers>=3,<6"]

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "ipykernel>=6,<8",
  "mypy>=1.11,<2",
  "nbconvert>=7,<8",
  "nbformat>=5,<6",
  "pre-commit>=3.8,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
cse-etl = "cse_financial_etl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cse_financial_etl"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cse_financial_etl"]

[[tool.mypy.overrides]]
module = "cse_financial_etl.reporting.excel"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "fitz",
  "networkx",
  "pdfplumber",
  "polars",
  "rapidfuzz",
  "sentence_transformers",
  "sentence_transformers.*",
  "sklearn.*",
  "yaml",
  "ocrmypdf",
  "docling",
  "docling.document_converter",
  "docling.*",
]
ignore_missing_imports = true
