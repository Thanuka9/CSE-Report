name: One-shot review decision typing fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove review-decision variable shadowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cse_financial_etl/contracts/release.py")
          text = path.read_text(encoding="utf-8")
          old = '''    decision_groups: dict[str, list[ReviewDecision]] = {}\n    for decision in decisions:\n        decision_groups.setdefault(decision.identity, []).append(decision)'''
          new = '''    decision_groups: dict[str, list[ReviewDecision]] = {}\n    for review_decision in decisions:\n        decision_groups.setdefault(review_decision.identity, []).append(review_decision)'''
          if text.count(old) != 1:
              raise SystemExit(f"expected grouping block once, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        decision = by_identity.get(identity)\n        if decision is None:\n            updated.append(fact)\n            continue\n        matched.add(identity)\n        if not decision.reviewer_id:\n            summary.unauthenticated += 1\n            updated.append(fact)\n            continue\n        authenticated, auth_reason = verify_decision_signature(decision)\n        if not authenticated:\n            summary.unauthenticated += 1\n            if auth_reason == "SIGNATURE_INVALID":\n                summary.invalid_signature += 1\n            if auth_reason.startswith("SIGNING_KEY_UNAVAILABLE"):\n                summary.signing_key_unavailable += 1\n            updated.append(fact)\n            continue\n        if decision.policy_version != policy_version:\n            summary.policy_mismatch += 1\n            updated.append(fact)\n            continue\n        if decision.filing_sha256 != filing_sha256:\n            summary.stale_source_hash += 1\n            updated.append(fact)\n            continue\n        if decision.fact_fingerprint != fact_fingerprint(fact):\n            summary.stale_fact_fingerprint += 1\n            updated.append(fact)\n            continue\n        if decision.decision == DECISION_APPROVED:\n            summary.approved_applied += 1\n        elif decision.decision == DECISION_REJECTED:\n            summary.rejected_applied += 1\n        else:\n            updated.append(fact)\n            continue\n        updated.append(replace(fact, review_status=decision.decision))'''
          new = '''        matched_decision = by_identity.get(identity)\n        if matched_decision is None:\n            updated.append(fact)\n            continue\n        matched.add(identity)\n        if not matched_decision.reviewer_id:\n            summary.unauthenticated += 1\n            updated.append(fact)\n            continue\n        authenticated, auth_reason = verify_decision_signature(matched_decision)\n        if not authenticated:\n            summary.unauthenticated += 1\n            if auth_reason == "SIGNATURE_INVALID":\n                summary.invalid_signature += 1\n            if auth_reason.startswith("SIGNING_KEY_UNAVAILABLE"):\n                summary.signing_key_unavailable += 1\n            updated.append(fact)\n            continue\n        if matched_decision.policy_version != policy_version:\n            summary.policy_mismatch += 1\n            updated.append(fact)\n            continue\n        if matched_decision.filing_sha256 != filing_sha256:\n            summary.stale_source_hash += 1\n            updated.append(fact)\n            continue\n        if matched_decision.fact_fingerprint != fact_fingerprint(fact):\n            summary.stale_fact_fingerprint += 1\n            updated.append(fact)\n            continue\n        if matched_decision.decision == DECISION_APPROVED:\n            summary.approved_applied += 1\n        elif matched_decision.decision == DECISION_REJECTED:\n            summary.rejected_applied += 1\n        else:\n            updated.append(fact)\n            continue\n        updated.append(replace(fact, review_status=matched_decision.decision))'''
          if text.count(old) != 1:
              raise SystemExit(f"expected lookup block once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit typing fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-mypy-shadow-fix.yml
          git add src/cse_financial_etl/contracts/release.py .github/workflows/one-shot-mypy-shadow-fix.yml
          git commit -m "Fix review decision typing after duplicate guard"
          git push
