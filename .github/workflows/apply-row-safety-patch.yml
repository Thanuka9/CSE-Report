name: Apply row safety patch

on:
  push:
    branches: [chatgpt/full-universe-row-safety-20260910]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/full-universe-row-safety-20260910
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.11'
          python-version: '3.12'
      - name: Apply systemic patch
        run: python scripts/apply_row_safety_patch.py
      - name: Format and smoke-check patched files
        run: |
          uv sync --locked --group dev
          uv run ruff format src/cse_financial_etl/validation/row_safety.py src/cse_financial_etl/extraction/unit_detector.py src/cse_financial_etl/compiler/units.py src/cse_financial_etl/transformation/ratios.py src/cse_financial_etl/orchestration/pipeline.py src/cse_financial_etl/extraction/statement_extractor.py tests/unit/test_unit_detector.py tests/unit/test_ratio_fail_closed.py
          uv run ruff check src/cse_financial_etl/validation/row_safety.py src/cse_financial_etl/extraction/unit_detector.py src/cse_financial_etl/compiler/units.py src/cse_financial_etl/transformation/ratios.py src/cse_financial_etl/orchestration/pipeline.py src/cse_financial_etl/extraction/statement_extractor.py tests/unit/test_unit_detector.py tests/unit/test_ratio_fail_closed.py
          uv run pytest tests/unit/test_unit_detector.py tests/unit/test_ratio_fail_closed.py -q
      - name: Commit patched product code
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix full-universe row-level correctness failures"
          git push origin HEAD:chatgpt/full-universe-row-safety-20260910
