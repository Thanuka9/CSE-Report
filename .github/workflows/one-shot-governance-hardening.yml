name: One-shot governance trust-boundary hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Quarantine duplicate decisions and unsigned legacy corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          release = "src/cse_financial_etl/contracts/release.py"
          replace_once(
              release,
              '''    signing_key_unavailable: int = 0\n    unmatched: int = 0\n''',
              '''    signing_key_unavailable: int = 0\n    duplicate_decision_identities: int = 0\n    unmatched: int = 0\n''',
          )
          replace_once(
              release,
              '''    by_identity: dict[str, ReviewDecision] = {\n        decision.identity: decision for decision in decisions\n    }\n    updated: list[Any] = []''',
              '''    decision_groups: dict[str, list[ReviewDecision]] = {}\n    for decision in decisions:\n        decision_groups.setdefault(decision.identity, []).append(decision)\n    duplicate_identities = {\n        identity for identity, items in decision_groups.items() if len(items) > 1\n    }\n    summary.duplicate_decision_identities = len(duplicate_identities)\n    by_identity: dict[str, ReviewDecision] = {\n        identity: items[0]\n        for identity, items in decision_groups.items()\n        if len(items) == 1\n    }\n    updated: list[Any] = []''',
          )
          replace_once(
              release,
              '''        decision = by_identity.get(identity)\n        if decision is None:\n            updated.append(fact)\n            continue''',
              '''        if identity in duplicate_identities:\n            # Never let JSONL ordering choose between multiple human decisions.\n            # Operators must resolve the conflicting/replayed identity explicitly.\n            matched.add(identity)\n            updated.append(fact)\n            continue\n        decision = by_identity.get(identity)\n        if decision is None:\n            updated.append(fact)\n            continue''',
          )
          replace_once(
              release,
              '''    summary.unmatched = len(\n        [identity for identity in by_identity if identity not in matched]\n    )''',
              '''    summary.unmatched = len(\n        [identity for identity in by_identity if identity not in matched]\n    )''',
          )

          repository = "src/cse_financial_etl/storage/repository.py"
          old = '''    def _apply_curated_corrections(self) -> None:\n        path = self.root / "curated" / "manual_corrections.parquet"\n        if not path.exists():\n            return\n        try:\n            frame = pl.read_parquet(path)\n        except Exception:\n            return\n        if frame.is_empty():\n            return\n        lookup = {\n            (str(row["issuer_name"]), str(row["period_end"]), str(row["metric_code"])): row\n            for row in frame.to_dicts()\n        }\n        for fact in self.fact_rows:\n            correction = lookup.get(\n                (str(fact["issuer_name"]), str(fact["period_end"]), str(fact["metric_code"]))\n            )\n            if correction is None:\n                continue\n            fact["normalized_value"] = correction.get("corrected_value")\n            fact["status"] = "EXTRACTED"\n            fact["review_status"] = "CURATED"\n            fact["validation_status"] = "PASSED"\n            fact["missing_reason"] = None\n            fact["extraction_method"] = "CURATED_OVERRIDE"\n'''
          new = '''    def _apply_curated_corrections(self) -> None:\n        """Quarantine the legacy unsigned correction file instead of mutating facts.\n\n        Official human decisions are source-SHA/fact-fingerprint/signature bound in\n        ``contracts.release``.  The historical parquet override had no equivalent\n        trust binding and could directly manufacture PASSED/CURATED values at the\n        storage boundary.  Preserve it only as review evidence until migrated to a\n        signed correction contract.\n        """\n\n        path = self.root / "curated" / "manual_corrections.parquet"\n        if not path.exists():\n            return\n        try:\n            frame = pl.read_parquet(path)\n        except Exception as exc:\n            self.add_review(\n                self.run_id or "UNKNOWN_RUN",\n                "UNKNOWN",\n                "UNKNOWN",\n                "LEGACY_CURATED_CORRECTION_UNREADABLE",\n                detail=f"{path}: {exc}",\n            )\n            return\n        if frame.is_empty():\n            return\n        for row in frame.to_dicts():\n            raw_period = row.get("period_end")\n            try:\n                period = date.fromisoformat(str(raw_period)) if raw_period else None\n            except ValueError:\n                period = None\n            self.add_review(\n                self.run_id or "UNKNOWN_RUN",\n                str(row.get("issuer_name") or "UNKNOWN"),\n                str(row.get("symbol") or "UNKNOWN"),\n                "UNSIGNED_CURATED_CORRECTION_QUARANTINED",\n                period_end=period,\n                metric_code=str(row.get("metric_code") or "UNKNOWN"),\n                detail=(\n                    "Legacy manual_corrections.parquet cannot mutate production facts; "\n                    "migrate the correction to the signed fact-bound review workflow."\n                ),\n                diagnostic_path=str(path),\n            )\n'''
          replace_once(repository, old, new)
          PY
      - name: Commit trust-boundary hardening and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-governance-hardening.yml
          git add src/cse_financial_etl/contracts/release.py src/cse_financial_etl/storage/repository.py .github/workflows/one-shot-governance-hardening.yml
          git commit -m "Quarantine ambiguous governance overrides"
          git push
