name: Temporary harden legacy fail-closed semantics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-harden-legacy-failclosed.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply hardening
        run: python .github/scripts/temp_harden_legacy.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden legacy extraction context ownership"
          git push origin HEAD:main
