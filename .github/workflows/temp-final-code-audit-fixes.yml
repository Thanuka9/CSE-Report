name: Apply final code audit fixes
on:
  push:
    branches: [chatgpt/final-code-audit-20260910]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/final-code-audit-20260910
      - name: Apply audited consistency fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'expected block not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Canonical issuer master: preserve effective dating and legal-name history,
          # and expose reporting currency separately from security trading currency.
          p = Path('src/cse_financial_etl/production/r4_hardening.py')
          text = p.read_text(encoding='utf-8')
          old = '''    previous_securities = [\n        row for row in previous.get("securities", []) if isinstance(row, dict)\n    ]\n    issuer_by_security_id: dict[int, str] = {}\n'''
          new = '''    previous_securities = [\n        row for row in previous.get("securities", []) if isinstance(row, dict)\n    ]\n    previous_issuer_by_id = {\n        str(row.get("issuer_id")): row\n        for row in previous_issuers\n        if row.get("issuer_id")\n    }\n    issuer_by_security_id: dict[int, str] = {}\n'''
          if old not in text:
              raise SystemExit('previous issuer index insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        configured = issuer_profile_for_name(legal_name)\n        symbols = sorted(str(row["symbol"]) for row in securities)\n        segment = None\n'''
          new = '''        configured = issuer_profile_for_name(legal_name)\n        old_issuer = previous_issuer_by_id.get(issuer_id, {})\n        symbols = sorted(str(row["symbol"]) for row in securities)\n        segment = None\n'''
          if old not in text:
              raise SystemExit('old issuer insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        segment = segment or "UNKNOWN"\n\n        issuer_rows.append(\n            {\n                "issuer_id": issuer_id,\n                "legal_name": legal_name,\n                "issuer_type": (\n                    configured.issuer_type if configured is not None else infer_issuer_type(legal_name)\n                ),\n                "standalone_scope_label": (\n                    configured.standalone_scope_label\n                    if configured is not None\n                    else infer_entity_scope(legal_name)\n                ),\n                "fiscal_year_end_month": (\n                    configured.fiscal_year_end_month if configured is not None else None\n                ),\n                "listing_segment": segment,\n                "symbols": symbols,\n                "active_from": as_of.isoformat(),\n                "active_to": None,\n            }\n        )\n'''
          new = '''        if segment is None:\n            previous_segment = str(old_issuer.get("listing_segment") or "").strip().upper()\n            segment = previous_segment or "UNKNOWN"\n\n        legal_name_history = [\n            str(item)\n            for item in old_issuer.get("legal_name_history", [])\n            if item\n        ]\n        old_legal_name = str(old_issuer.get("legal_name") or "").strip()\n        if old_legal_name and old_legal_name != legal_name and old_legal_name not in legal_name_history:\n            legal_name_history.append(old_legal_name)\n\n        current_currencies = {\n            str(fact.get("currency") or "").strip().upper()\n            for fact in repository.fact_rows\n            if str(fact.get("issuer_name") or "") == legal_name\n            and str(fact.get("currency") or "").strip()\n            and str(fact.get("status") or "") in PUBLISHABLE\n        }\n        reporting_currency = (\n            next(iter(current_currencies))\n            if len(current_currencies) == 1\n            else str(old_issuer.get("reporting_currency") or "").strip().upper() or None\n        )\n        prior_fy_end = old_issuer.get("fiscal_year_end_month")\n        fiscal_year_end_month = (\n            configured.fiscal_year_end_month\n            if configured is not None and configured.fiscal_year_end_month is not None\n            else prior_fy_end\n        )\n\n        issuer_rows.append(\n            {\n                "issuer_id": issuer_id,\n                "legal_name": legal_name,\n                "legal_name_history": legal_name_history,\n                "issuer_type": (\n                    configured.issuer_type if configured is not None else infer_issuer_type(legal_name)\n                ),\n                "standalone_scope_label": (\n                    configured.standalone_scope_label\n                    if configured is not None\n                    else infer_entity_scope(legal_name)\n                ),\n                "reporting_currency": reporting_currency,\n                "fiscal_year_end_month": fiscal_year_end_month,\n                "listing_segment": segment,\n                "symbols": symbols,\n                "active_from": str(old_issuer.get("active_from") or as_of.isoformat()),\n                "active_to": None,\n            }\n        )\n'''
          if old not in text:
              raise SystemExit('canonical issuer row block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Extend the R4 regression test to cover the effective-dated identity contract.
          p = Path('tests/unit/test_r4_hardening.py')
          text = p.read_text(encoding='utf-8')
          old = '''    first.market_rows = [\n        {\n            "security_id": 101,\n            "company_name": "Old Name PLC",\n            "symbol": "OLD.N0000",\n        }\n    ]\n    _path, first_master = build_canonical_master(tmp_path, date(2026, 6, 30), first)\n'''
          new = '''    first.market_rows = [\n        {\n            "security_id": 101,\n            "company_name": "Old Name PLC",\n            "symbol": "OLD.N0000",\n        }\n    ]\n    first.fact_rows = [\n        {\n            "issuer_name": "Old Name PLC",\n            "currency": "LKR",\n            "status": "EXTRACTED",\n        }\n    ]\n    _path, first_master = build_canonical_master(tmp_path, date(2026, 6, 30), first)\n'''
          if old not in text:
              raise SystemExit('canonical master test setup not found')
          text = text.replace(old, new, 1)
          old = '''    assert current[0]["issuer_id"] == issuer_id\n    security = [row for row in second_master["securities"] if not row.get("active_to")][0]\n'''
          new = '''    assert current[0]["issuer_id"] == issuer_id\n    assert current[0]["active_from"] == "2026-06-30"\n    assert current[0]["reporting_currency"] == "LKR"\n    assert "Old Name PLC" in current[0]["legal_name_history"]\n    security = [row for row in second_master["securities"] if not row.get("active_to")][0]\n'''
          if old not in text:
              raise SystemExit('canonical master test assertions not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Align old public target/helper names with the actual 14-field production contract.
          p = Path('src/cse_financial_etl/facts/target_metrics.py')
          text = p.read_text(encoding='utf-8')
          old = '''TARGET_METRIC_CODES: tuple[str, ...] = (\n    "PAT",\n    "PBT",\n    "EPS",  # diluted if valid else basic\n    "NAVPS",\n    "OPERATING_PROFIT",\n    "TOTAL_EQUITY",\n    "TOTAL_ASSETS",\n    "TOTAL_LIABILITIES",\n    "TOP_LINE",\n    "MARKET_PRICE",\n    "DEBT_TO_EQUITY",\n    "ROE_Q",\n    "ROA_Q",\n    "NPM_Q",\n)\n'''
          new = '''TARGET_METRIC_CODES: tuple[str, ...] = (\n    "PAT",\n    "PBT",\n    "EPS_SELECTED",  # diluted when valid/reported, otherwise basic\n    "NAVPS",\n    "OPERATING_PROFIT",\n    "TOTAL_EQUITY",\n    "TOTAL_ASSETS",\n    "TOTAL_LIABILITIES",\n    "TOP_LINE",\n    "MARKET_PRICE_QUARTER_END",\n    "DEBT_TO_EQUITY",  # legacy internal code; canonical semantic is LIABILITIES_TO_EQUITY\n    "ROE",\n    "ROA",\n    "NPM",\n)\n'''
          if old not in text:
              raise SystemExit('target metric code block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('src/cse_financial_etl/facts/derived_facts.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('_ratio("ROE_Q", pat, equity, "quarter PAT / quarter-end Total Equity")', '_ratio("ROE", pat, equity, "quarter PAT / quarter-end Total Equity")')
          text = text.replace('_ratio("ROA_Q", pat, assets, "quarter PAT / quarter-end Total Assets")', '_ratio("ROA", pat, assets, "quarter PAT / quarter-end Total Assets")')
          text = text.replace('_ratio("NPM_Q", pat, top_line, "quarter PAT / quarter top line")', '_ratio("NPM", pat, top_line, "quarter PAT / quarter top line")')
          p.write_text(text, encoding='utf-8')

          # Bring the frozen production specification back in line with the actual governed policy.
          p = Path('docs/production_specification.md')
          text = p.read_text(encoding='utf-8')
          old = '- Q4 flow metrics prefer an explicit standalone three-month/`4Q` column. When none exists, eligible flows may be derived only from compatible normalized cumulative and preceding standalone quarters with complete lineage; EPS is never derived this way.\n'
          new = '- Q4 flow metrics require an explicitly reported standalone three-month/`4Q` value. Cumulative 6M/9M/YTD/FY values may be retained as audit evidence but are never differenced or published as the reported quarter.\n'
          if old not in text:
              raise SystemExit('stale frozen Q4 bullet not found')
          text = text.replace(old, new, 1)
          old = '''Q4 flow metrics prefer an explicit standalone three-month/`4Q` column. When none exists, eligible flow metrics (`TOP_LINE`, `OPERATING_PROFIT`, `PBT`, `PAT`) may be derived only from compatible normalized cumulative values and preceding standalone quarters, with complete formula lineage. Do not publish a full-year column as Q4 without that derivation. Never derive Q4 EPS. If the inputs are missing or incompatible, record `EXACT_QUARTER_NOT_REPORTED` or `CUMULATIVE_ONLY`.'''
          new = '''Q4 flow metrics require an explicitly reported standalone three-month/`4Q` column. Annual, 6M, 9M and YTD values are never copied or differenced into a published quarter. Cumulative-only evidence remains available for audit/review; when an exact three-month Q4 is not reported or cannot be resolved, record `EXACT_QUARTER_NOT_REPORTED` or `CUMULATIVE_ONLY` and leave the quarter value unpopulated.'''
          if old not in text:
              raise SystemExit('stale Q4 section not found')
          text = text.replace(old, new, 1)
          old = '| `TOTAL_LIABILITIES` | Monetary absolute | As at | Explicit total, or Assets minus Equity with derived lineage | Explicit total, or Assets minus Equity with derived lineage |'
          new = '| `TOTAL_LIABILITIES` | Monetary absolute | As at | Explicit standalone Total Liabilities row only | Explicit standalone Total Liabilities row only |'
          if old not in text:
              raise SystemExit('stale liabilities row not found')
          text = text.replace(old, new, 1)
          old = '- `INSURANCE`: prefer IFRS 17 insurance revenue for top line. Accept operating profit only when explicitly presented or when a formally approved mapping exists.\n'
          new = '- `INSURANCE`: retain the filing’s actual top-line basis and accounting-regime evidence. `Insurance revenue`, `Gross written premium`, and `Net earned premium` are not treated as interchangeable; accept operating profit only when explicitly presented or when a formally approved mapping exists.\n'
          if old not in text:
              raise SystemExit('stale insurance rule not found')
          text = text.replace(old, new, 1)
          text = text.replace('| `RATIO` | No | Debt/equity, capital ratios |', '| `RATIO` | No | Liabilities/equity, capital ratios |')
          p.write_text(text, encoding='utf-8')

          p = Path('docs/metric_methodology.md')
          text = p.read_text(encoding='utf-8')
          old = '- Debt to equity: total liabilities divided by total equity, expressed as a multiple (`x`).\n'
          new = '- Liabilities / Equity: total liabilities divided by total equity, expressed as a multiple (`x`). The legacy internal code remains `DEBT_TO_EQUITY` for backward compatibility.\n'
          if old not in text:
              raise SystemExit('metric methodology leverage label not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit audit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cse_financial_etl/production/r4_hardening.py tests/unit/test_r4_hardening.py src/cse_financial_etl/facts/target_metrics.py src/cse_financial_etl/facts/derived_facts.py docs/production_specification.md docs/metric_methodology.md
          git commit -m "Fix final code-audit consistency issues"
          git push origin HEAD:chatgpt/final-code-audit-20260910
