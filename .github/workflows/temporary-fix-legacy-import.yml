name: Temporary fix legacy import order

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-fix-legacy-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python .github/scripts/fix_legacy_import_order.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix legacy hardening import order"
          git push origin HEAD:main
