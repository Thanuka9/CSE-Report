name: Diagnose continuation entity ownership

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - name: Trace synthetic continuation through native compiler
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          import tempfile
          from datetime import date
          from pathlib import Path

          from cse_financial_etl.accounting.sector_profiles import profile_for_issuer
          from cse_financial_etl.compiler.known_context import build_known_context
          from cse_financial_etl.compiler.statement_compiler import compile_statements
          from cse_financial_etl.config import infer_entity_scope, load_issuers
          from cse_financial_etl.document.continuation import detect_continuations
          from cse_financial_etl.document.region_detector import detect_regions
          from cse_financial_etl.document.table_reconstructor import reconstruct_tables
          from cse_financial_etl.ingestion.quality_router import route_document_ingestion
          from cse_financial_etl.tunnels.tunnel_a_geometry import run_tunnel_a
          from tests.regression.redesign.synthetic_pdf_factory import statement_page, write_pdf

          root = Path.cwd()
          issuer = "Dialog Axiata PLC"
          symbol = "DIAL.N0000"
          period = date(2026, 6, 30)
          load_issuers(root)
          entity = infer_entity_scope(issuer)
          profile = profile_for_issuer(issuer)
          known = build_known_context(
              issuer_name=issuer,
              symbol=symbol,
              period_end=period,
              required_entity=entity,
              sector_profile=profile.code,
          )
          first = statement_page(
              title="STATEMENT OF PROFIT OR LOSS - COMPANY",
              period_line="For the three months ended 30 June 2026",
              unit_line="Rs.'000",
              headers=[(380.0, "30 Jun 2026"), (485.0, "30 Jun 2025")],
              rows=[
                  ("Revenue", [(380.0, "1,000"), (485.0, "900")]),
                  ("Operating profit", [(380.0, "250"), (485.0, "180")]),
              ],
          )
          second = statement_page(
              title="COMPANY",
              period_line="For the three months ended 30 June 2026",
              unit_line="Rs.'000",
              headers=[(380.0, "30 Jun 2026"), (485.0, "30 Jun 2025")],
              rows=[
                  ("Profit before tax", [(380.0, "200"), (485.0, "150")]),
                  ("Profit for the period", [(380.0, "160"), (485.0, "120")]),
              ],
              extra_bottom_lines=["Continued from the preceding statement page"],
          )
          with tempfile.TemporaryDirectory() as td:
              pdf = write_pdf(Path(td) / "continuation.pdf", [first, second])
              document = reconstruct_tables(route_document_ingestion(pdf, ocr_enabled=False))
              regions = detect_regions(document)
              links = detect_continuations(document, regions)
              statements = compile_statements(document, regions, known)
              tunnel = run_tunnel_a(
                  pdf,
                  issuer_name=issuer,
                  symbol=symbol,
                  period_end=period,
                  ocr_enabled=False,
                  known=known,
                  legacy_facts=None,
                  document=document,
                  compile_statements=True,
              )

              def phrase(p):
                  return {"text": p.text, "kind": p.kind, "row": p.row_idx,
                          "bbox": [p.bbox.x0, p.bbox.y0, p.bbox.x1, p.bbox.y1]}
              payload = {
                  "required_entity": entity,
                  "regions": [vars(r) for r in regions],
                  "links": [vars(l) for l in links],
                  "page2_lines": [line.text for line in document.pages[1].lines[:12]],
                  "page2_tables": [
                      {
                          "title_texts": list(t.title_texts),
                          "caption_phrases": [phrase(p) for p in t.caption_phrases],
                          "header_phrases": [phrase(p) for p in t.header_phrases],
                          "columns": [
                              {"idx": c.col_idx, "kind": c.kind, "x": c.x_center}
                              for c in t.columns
                          ],
                      }
                      for t in document.pages[1].tables
                  ],
                  "compiled_page2": [
                      {
                          "statement_type": s.statement_type,
                          "table_index": s.table_index,
                          "evidence": s.compilation_evidence,
                          "conflicts": s.header_conflicts,
                          "columns": [
                              {
                                  "id": c.column_id,
                                  "idx": c.col_idx,
                                  "kind": c.kind,
                                  "entity": c.entity,
                                  "period": c.period_end.isoformat() if c.period_end else None,
                                  "duration": c.duration_months,
                                  "role": c.comparison_role,
                                  "evidence": c.evidence,
                                  "conflicts": list(c.conflicts),
                              }
                              for c in s.columns
                          ],
                          "rows": [r.raw_label for r in s.rows],
                      }
                      for s in statements if s.page_start == 2
                  ],
                  "ledger_pbt_pat": [
                      {
                          "concept": e.concept,
                          "entity": e.entity,
                          "period": e.period_end,
                          "duration": e.duration_months,
                          "role": e.comparison_role,
                          "status": e.status,
                          "reasons": e.reasons,
                          "page": e.page,
                          "label": e.label,
                          "evidence": e.evidence,
                      }
                      for e in tunnel["ledger"].entries
                      if e.concept in {"PBT", "PAT"}
                  ],
              }
              print("CONTINUATION_DIAGNOSTIC_START")
              print(json.dumps(payload, indent=2, default=str))
              print("CONTINUATION_DIAGNOSTIC_END")
          PY
      - name: Remove temporary diagnostic workflow
        run: |
          rm .github/workflows/diagnose-continuation-entity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove continuation diagnostic workflow"
          git push
