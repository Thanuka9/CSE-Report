name: Targeted NDB stock-context diagnostic

on:
  push:
    branches:
      - chatgpt/final-engineering-hardening-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript tesseract-ocr
      - name: Install locked environment
        run: uv sync --locked --group dev --extra ocr
      - name: Diagnose NDB stock context
        run: uv run python scripts/debug_ndb_stock_context.py
      - name: Upload NDB diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndb-stock-context
          path: outputs/ndb_debug
          if-no-files-found: error
