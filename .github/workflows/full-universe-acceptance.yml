name: Full universe acceptance

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: CSE snapshot date (YYYY-MM-DD)
        required: true
        default: '2026-09-09'

permissions:
  contents: read

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --group dev
      - name: Resolve acceptance date
        id: date
        shell: bash
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          if [ -z "$AS_OF" ]; then AS_OF="2026-09-09"; fi
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
      - name: Run complete CSE universe
        run: uv run cse-etl run --as-of "${{ steps.date.outputs.as_of }}" --skip-excel --tunnel-b-always
      - name: Build 100-issuer adjudication packet
        if: always()
        run: uv run cse-etl prepare-adjudication --as-of "${{ steps.date.outputs.as_of }}" --target-issuers 100
      - name: Separate engineering failures from external proof gates
        if: always()
        run: |
          uv run python scripts/check_universe_acceptance.py \
            --manifest "outputs/manifests/run_manifest_${{ steps.date.outputs.as_of }}.json" \
            --review "outputs/review_queue_${{ steps.date.outputs.as_of }}.csv" \
            --output "outputs/universe_acceptance_${{ steps.date.outputs.as_of }}.json"
      - name: Upload universe acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-${{ steps.date.outputs.as_of }}
          path: |
            outputs/*.json
            outputs/*.csv
            outputs/manifests/*.json
          if-no-files-found: error
