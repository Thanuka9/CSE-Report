name: Full universe acceptance

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: CSE live observation date (YYYY-MM-DD); blank uses current Asia/Colombo date
        required: false
        default: ''
      process_timeout_seconds:
        description: Hard per-PDF extraction/OCR timeout
        required: true
        default: '480'
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  universe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.11'
          python-version: '3.12'
          enable-cache: true
      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript tesseract-ocr
      - name: Install locked environment with OCR support
        run: uv sync --locked --group dev --extra ocr
      - name: Resolve production inputs
        id: inputs
        shell: bash
        run: |
          AS_OF="${{ github.event.inputs.as_of }}"
          if [ -z "$AS_OF" ]; then AS_OF="$(TZ=Asia/Colombo date +%F)"; fi
          TIMEOUT="${{ github.event.inputs.process_timeout_seconds }}"
          if [ -z "$TIMEOUT" ]; then TIMEOUT="480"; fi
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
          echo "timeout=$TIMEOUT" >> "$GITHUB_OUTPUT"
      - name: Restore resumable CSE run cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/raw
            data/cache/resilient
            data/bronze
          key: cse-universe-${{ steps.inputs.outputs.as_of }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cse-universe-${{ steps.inputs.outputs.as_of }}-
      - name: Run governed complete CSE universe
        run: |
          uv run python scripts/run_production_pipeline.py \
            --as-of "${{ steps.inputs.outputs.as_of }}" \
            --process-timeout-seconds "${{ steps.inputs.outputs.timeout }}" \
            --skip-excel \
            --tunnel-b-always
      - name: Audit row-level safety invariants
        if: always()
        run: |
          uv run python scripts/audit_row_safety.py \
            --facts "outputs/normalized_facts_${{ steps.inputs.outputs.as_of }}.csv" \
            --prices "outputs/quarter_end_prices_${{ steps.inputs.outputs.as_of }}.csv" \
            --output "outputs/row_safety_${{ steps.inputs.outputs.as_of }}.json"
      - name: Build 100-issuer adjudication packet
        if: always()
        run: uv run cse-etl prepare-adjudication --as-of "${{ steps.inputs.outputs.as_of }}" --target-issuers 100
      - name: Independently recheck universe acceptance
        if: always()
        run: |
          uv run python scripts/check_universe_acceptance.py \
            --manifest "outputs/manifests/run_manifest_${{ steps.inputs.outputs.as_of }}.json" \
            --review "outputs/review_queue_${{ steps.inputs.outputs.as_of }}.csv" \
            --facts "outputs/normalized_facts_${{ steps.inputs.outputs.as_of }}.csv" \
            --errors "outputs/pipeline_errors_${{ steps.inputs.outputs.as_of }}.json" \
            --baseline "configs/coverage_baseline.yml" \
            --output "outputs/universe_acceptance_recheck_${{ steps.inputs.outputs.as_of }}.json"
      - name: Build final consolidated review workbook
        if: always()
        run: |
          uv run python scripts/build_final_workbook.py \
            --as-of "${{ steps.inputs.outputs.as_of }}"
      - name: Upload universe acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-universe-${{ steps.inputs.outputs.as_of }}
          path: |
            outputs/*.json
            outputs/*.jsonl
            outputs/*.csv
            outputs/*.xlsx
            outputs/workbooks/*.xlsx
            outputs/manifests/*.json
          if-no-files-found: error

  manual-qa-source-pack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download September 10 universe artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior
          gh api /repos/${{ github.repository }}/actions/artifacts/10156770248/zip > prior.zip
          unzip -q prior.zip -d prior
          test -f prior/adjudication_packet_2026-09-10.csv
      - name: Fetch exact official CSE source PDFs
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, json, re, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          API = "https://www.cse.lk/api/financials"
          CDN = "https://cdn.cse.lk/"
          UA = "CSE-Manual-QA-Source-Pack/1.0 (+public regulatory research)"
          packet = Path("prior/adjudication_packet_2026-09-10.csv")
          out = Path("manual_qa_source_pack")
          pdf_root = out / "pdfs"
          out.mkdir(parents=True, exist_ok=True)
          pdf_root.mkdir(parents=True, exist_ok=True)

          def slug(s):
              return re.sub(r"[^A-Za-z0-9]+", "_", s).strip("_")[:100]

          def cdn_url(path):
              if path.startswith(("http://", "https://")):
                  return path
              return urllib.parse.urljoin(CDN, urllib.parse.quote(path.lstrip("/"), safe="/%:@"))

          def post_financials(symbol):
              data = urllib.parse.urlencode({"symbol": symbol}).encode("ascii")
              req = urllib.request.Request(API, data=data, method="POST", headers={
                  "Accept":"application/json","Accept-Language":"en",
                  "Content-Type":"application/x-www-form-urlencoded","User-Agent":UA})
              last = None
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=45) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as exc:
                      last = exc
                      time.sleep(min(2 ** attempt, 12))
              raise RuntimeError(f"financials API failed for {symbol}: {last}")

          def fetch_pdf(url):
              req = urllib.request.Request(url, headers={"User-Agent":UA})
              last = None
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=120) as r:
                          payload = r.read()
                      if not payload.startswith(b"%PDF"):
                          raise RuntimeError("response is not a PDF")
                      return payload
                  except Exception as exc:
                      last = exc
                      time.sleep(min(2 ** attempt, 12))
              raise RuntimeError(f"PDF download failed: {url}: {last}")

          with packet.open(newline="", encoding="utf-8-sig") as f:
              rows = list(csv.DictReader(f))
          targets = {}
          for row in rows:
              key = (row["issuer_name"].strip(), row["symbol"].strip(),
                     row["period_end"].strip(), row["filing_sha256"].strip())
              targets[key] = None

          manifest_rows = []
          exact = misses = 0
          for idx, (issuer, symbol, period_end, expected_sha) in enumerate(targets, 1):
              record = {
                  "issuer_name":issuer,"symbol":symbol,"period_end":period_end,
                  "expected_sha256":expected_sha,"matched_sha256":"","hash_match":"FALSE",
                  "filing_id":"","file_text":"","source_path":"","source_url":"","bytes":"",
                  "status":"","error":""}
              try:
                  payload = post_financials(symbol)
                  candidates = []
                  for item in payload.get("infoQuarterlyData") or []:
                      path = str(item.get("path") or "").strip()
                      if path.lower().endswith(".pdf"):
                          candidates.append((item, cdn_url(path)))
                  matched = None
                  candidate_errors = []
                  for item, url in candidates:
                      try:
                          blob = fetch_pdf(url)
                          sha = hashlib.sha256(blob).hexdigest()
                          if sha == expected_sha:
                              matched = (item, url, blob, sha)
                              break
                      except Exception as exc:
                          candidate_errors.append(f"{url}: {exc}")
                  if matched is None:
                      record["status"] = "EXPECTED_SHA_NOT_FOUND"
                      record["error"] = " | ".join(candidate_errors[-5:])
                      misses += 1
                  else:
                      item, url, blob, sha = matched
                      dest_dir = pdf_root / slug(issuer)
                      dest_dir.mkdir(parents=True, exist_ok=True)
                      base = Path(urllib.parse.unquote(urllib.parse.urlsplit(url).path)).name
                      dest = dest_dir / f"{period_end}_{base}"
                      dest.write_bytes(blob)
                      record.update({
                          "matched_sha256":sha,"hash_match":"TRUE","filing_id":str(item.get("id") or ""),
                          "file_text":str(item.get("fileText") or ""),"source_path":str(item.get("path") or ""),
                          "source_url":url,"bytes":str(len(blob)),"status":"EXACT_SOURCE_FETCHED"})
                      exact += 1
              except Exception as exc:
                  record["status"] = "SOURCE_LOOKUP_FAILED"
                  record["error"] = repr(exc)
                  misses += 1
              manifest_rows.append(record)
              print(f"[{idx:03d}/{len(targets):03d}] {record['status']}: {issuer} {period_end}")
              time.sleep(0.15)

          fields = ["issuer_name","symbol","period_end","expected_sha256","matched_sha256","hash_match",
                    "filing_id","file_text","source_path","source_url","bytes","status","error"]
          with (out / "source_manifest.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(manifest_rows)
          summary = {
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "target_issuers":len(targets),"exact_source_fetched":exact,
              "not_exact_or_failed":misses,
              "source":"official CSE financials API + cdn.cse.lk",
              "reference_artifact_id":10156770248}
          (out / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload source pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-qa-source-pack-2026-09-27
          path: manual_qa_source_pack
          retention-days: 7
          if-no-files-found: error
