name: Apply final geometry ownership fixes

on:
  push:
    paths:
      - .github/workflows/apply-final-geometry-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply source-ownership and realistic-geometry fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/cse_financial_etl/compiler/header_tree.py",
              '''        if (\n            target_period_end is not None\n            and role == "CURRENT"\n            and col.period_end is not None\n            and col.period_end != target_period_end\n        ):\n''',
              '''        if (\n            target_period_end is not None\n            and role == "CURRENT"\n            and col.period_end is not None\n            and col.period_end != target_period_end\n            and len(groups.get((col.entity, col.duration_months, col.temporal_type), ())) == 1\n        ):\n''',
          )
          replace_once(
              "src/cse_financial_etl/compiler/header_tree.py",
              '''        # Known target context may only *remove* a false CURRENT classification.\n        # It never creates CURRENT.  This protects prior-only OCR survivors from\n        # being promoted merely because they are the latest date still visible.\n''',
              '''        # Known target context may only *remove* a false CURRENT classification\n        # from a single surviving source column. It never creates CURRENT and never\n        # rewrites the relative roles of a complete multi-column source table.\n''',
          )

          replace_once(
              "tests/regression/redesign/synthetic_pdf_factory.py",
              '''    headers: Sequence[ValueCell],\n    rows: Sequence[RowSpec],\n    title_x: float = 48.0,\n''',
              '''    headers: Sequence[ValueCell],\n    rows: Sequence[RowSpec],\n    header_rows: Sequence[Sequence[ValueCell]] | None = None,\n    title_x: float = 48.0,\n''',
          )
          replace_once(
              "tests/regression/redesign/synthetic_pdf_factory.py",
              '''    for x, text in headers:\n        ops.append((x, y, text))\n    y += 20.0\n''',
              '''    owned_header_rows = header_rows if header_rows is not None else (headers,)\n    for header_row in owned_header_rows:\n        for x, text in header_row:\n            ops.append((x, y, text))\n        y += 18.0\n    y += 2.0\n''',
          )

          replace_once(
              "tests/regression/redesign/test_synthetic_pdf_gauntlet.py",
              '''        headers=[\n            (288.0, "GROUP"),\n            (438.0, "COMPANY"),\n            (270.0, "30 Jun 2026"),\n            (345.0, "30 Jun 2025"),\n            (430.0, "30 Jun 2026"),\n            (505.0, "30 Jun 2025"),\n        ],\n''',
              '''        headers=[],\n        header_rows=[\n            [(288.0, "GROUP"), (438.0, "COMPANY")],\n            [\n                (270.0, "30 Jun 2026"),\n                (345.0, "30 Jun 2025"),\n                (430.0, "30 Jun 2026"),\n                (505.0, "30 Jun 2025"),\n            ],\n        ],\n''',
          )

          replace_once(
              "tests/regression/test_structure_benchmark.py",
              '''from cse_financial_etl.validation.cross_filing import flag_cross_filing_mismatches\n''',
              '''from cse_financial_etl.validation.cross_filing import flag_cross_filing_mismatches\nfrom tests.regression.redesign.synthetic_pdf_factory import statement_page, write_pdf\n''',
          )
          replace_once(
              "tests/regression/test_structure_benchmark.py",
              '''def test_statement_unit_is_inherited_when_away_from_row(tmp_path: Path) -> None:\n    pdf = _write_pdf(\n        tmp_path / "units.pdf",\n        "Statement of profit or loss - Company\\n"\n        "For the three months ended 30 June 2025\\n"\n        "30 June 2025 30 June 2024\\n"\n        "Rs.'000\\n"\n        "Revenue 1,000 900\\n"\n        "Profit for the period 250 180\\n",\n    )\n    facts = facts_by_code(extract_filing(pdf, "Acme PLC", "ACM.N0000", PERIOD, ocr_enabled=False))\n''',
              '''def test_statement_unit_is_inherited_when_away_from_row(tmp_path: Path) -> None:\n    # This benchmark isolates statement-scoped unit inheritance.  Use explicit\n    # geometric value columns so the test does not accidentally ask a coordinate\n    # parser to invent column ownership from a prose text box.\n    page = statement_page(\n        title="Statement of profit or loss - Company",\n        period_line="For the three months ended 30 June 2025",\n        unit_line="Rs.'000",\n        headers=[(380.0, "30 June 2025"), (480.0, "30 June 2024")],\n        rows=[\n            ("Revenue", [(380.0, "1,000"), (480.0, "900")]),\n            ("Profit for the period", [(380.0, "250"), (480.0, "180")]),\n        ],\n    )\n    pdf = write_pdf(tmp_path / "units.pdf", [page])\n    facts = facts_by_code(extract_filing(pdf, "Acme PLC", "ACM.N0000", PERIOD, ocr_enabled=False))\n''',
          )
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-final-geometry-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve complete header roles and realistic geometry tests"
          git push origin HEAD:main
