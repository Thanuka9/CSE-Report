name: Final comparative-column full-universe proof

on:
  push:
    branches: [chatgpt/final-comparative-fix-20260910]

permissions:
  contents: read

jobs:
  universe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.11'
          python-version: '3.12'
          enable-cache: true
      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript tesseract-ocr
      - name: Install locked environment with OCR support
        run: uv sync --locked --group dev --extra ocr
      - name: Restore resumable CSE run cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            data/raw
            data/cache/resilient
            data/bronze
          key: cse-universe-2026-09-10-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cse-universe-2026-09-10-
      - name: Run governed complete CSE universe
        continue-on-error: true
        run: |
          uv run python scripts/run_production_pipeline.py \
            --as-of 2026-09-10 \
            --process-timeout-seconds 480 \
            --skip-excel \
            --tunnel-b-always
      - name: Audit row-level safety invariants
        if: always()
        run: |
          uv run python scripts/audit_row_safety.py \
            --facts outputs/normalized_facts_2026-09-10.csv \
            --prices outputs/quarter_end_prices_2026-09-10.csv \
            --output outputs/row_safety_2026-09-10.json
      - name: Independently recheck universe acceptance
        if: always()
        continue-on-error: true
        run: |
          uv run python scripts/check_universe_acceptance.py \
            --manifest outputs/manifests/run_manifest_2026-09-10.json \
            --review outputs/review_queue_2026-09-10.csv \
            --facts outputs/normalized_facts_2026-09-10.csv \
            --errors outputs/pipeline_errors_2026-09-10.json \
            --baseline configs/coverage_baseline.yml \
            --output outputs/universe_acceptance_recheck_2026-09-10.json
      - name: Verify Sathosa comparative leak is closed
        if: always()
        shell: python
        run: |
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path('outputs/normalized_facts_2026-09-10.csv').open(encoding='utf-8-sig')))
          hit = [r for r in rows if r['symbol']=='SMOT.N0000' and r['period_end']=='2026-03-31' and r['metric_code']=='NAVPS']
          assert len(hit) == 1, hit
          row = hit[0]
          assert row['status'] not in {'EXTRACTED','EXTRACTED_DERIVED'}, row
          assert row['normalized_value'] in {'', None}, row
          print(row)
      - name: Upload final comparative proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-comparative-proof-2026-09-10
          path: |
            outputs/*.json
            outputs/*.csv
            outputs/manifests/*.json
          if-no-files-found: error
