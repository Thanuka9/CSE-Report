name: Apply comparative-column fix

on:
  push:
    branches: [chatgpt/recalibrate-safe-baseline-20260910]
    paths: [.github/workflows/apply-comparative-column-fix-20260910.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply fail-closed comparative fixes
        shell: python
        run: |
          from pathlib import Path

          statement = Path('src/cse_financial_etl/extraction/statement_extractor.py')
          text = statement.read_text(encoding='utf-8')

          old = '''        # Reject prior-year / comparative columns for FLOW and STOCK.\n        if (\n            target_year_points\n            and prior_year_points\n            and _closeness(x, prior_year_points, page.width)\n            > _closeness(x, target_year_points, page.width)\n        ):\n            continue\n'''
          new = '''        # Reject a geometrically proven comparative even when the current header is\n        # missing/corrupted. Requiring both target and comparative header evidence\n        # let a clean prior-period cell masquerade as CURRENT when OCR destroyed the\n        # current header/value. Scope date evidence to the required entity so a Group\n        # date cannot validate a Company value (and vice versa).\n        entity_target_points = target_date_points\n        entity_prior_points = prior_year_points\n        if entity_regions and entity in {"COMPANY", "BANK"}:\n            entity_target_points = [\n                point\n                for point in target_date_points\n                if (span := _parent_kind_at(point, entity_regions)) is not None\n                and span.kind == entity\n            ]\n            entity_prior_points = [\n                point\n                for point in prior_year_points\n                if (span := _parent_kind_at(point, entity_regions)) is not None\n                and span.kind == entity\n            ]\n            # In a multi-entity stock table, a clean comparative header plus no\n            # current header for the required entity is unresolved, not CURRENT.\n            if rule.statement == "STOCK" and entity_prior_points and not entity_target_points:\n                continue\n        target_period_near = _closeness(x, entity_target_points, page.width)\n        comparative_near = _closeness(x, entity_prior_points, page.width)\n        if (\n            entity_prior_points\n            and comparative_near >= 0.65\n            and comparative_near > target_period_near\n        ):\n            continue\n'''
          if old not in text:
              raise SystemExit('statement comparative scoring block not found')
          text = text.replace(old, new, 1)

          old = '''    if not scored:\n        company_money = [\n            (token, value)\n            for token, value in candidates\n            if value is not None\n            and (parent := _parent_kind_at(token.bbox.center_x, entity_regions)) is not None\n            and parent.kind == entity\n        ]\n'''
          new = '''    if not scored:\n        # The single-company-value fallback must obey the same temporal guard as the\n        # scored path. Otherwise rejecting a comparative above simply reintroduces it\n        # here as the only surviving-looking Company amount.\n        company_money = [\n            (token, value)\n            for token, value in candidates\n            if value is not None\n            and (parent := _parent_kind_at(token.bbox.center_x, entity_regions)) is not None\n            and parent.kind == entity\n            and not (\n                prior_year_points\n                and _closeness(token.bbox.center_x, prior_year_points, page.width) >= 0.65\n                and _closeness(token.bbox.center_x, prior_year_points, page.width)\n                > _closeness(token.bbox.center_x, target_date_points, page.width)\n            )\n        ]\n'''
          if old not in text:
              raise SystemExit('statement fallback block not found')
          text = text.replace(old, new, 1)

          old = '''def _comparison_from_layout(\n    page: PageIR,\n    line: LineIR,\n    token: TokenIR,\n    period_end: date,\n) -> tuple[str, int]:\n    """Infer comparison_role and source header year from spatial year/date headers."""\n\n    target_points, prior_points = _period_header_points(page, line, period_end)\n    x = token.bbox.center_x\n    if target_points or prior_points:\n        target_near = _closeness(x, target_points, page.width) if target_points else 0.0\n        prior_near = _closeness(x, prior_points, page.width) if prior_points else 0.0\n        if prior_points and prior_near > target_near:\n            return "COMPARATIVE", period_end.year - 1\n        if target_points and target_near >= prior_near:\n            return "CURRENT", period_end.year\n    return "CURRENT", period_end.year\n'''
          new = '''def _comparison_from_layout(\n    page: PageIR,\n    line: LineIR,\n    token: TokenIR,\n    period_end: date,\n    *,\n    entity: str | None = None,\n) -> tuple[str, int]:\n    """Infer comparison role from column-local temporal evidence, never page captions."""\n\n    target_points, prior_points = _period_header_points(page, line, period_end)\n    if entity in {"COMPANY", "BANK"}:\n        regions = _entity_parent_regions(page, line)\n        if regions:\n            target_points = [\n                point\n                for point in target_points\n                if (span := _parent_kind_at(point, regions)) is not None and span.kind == entity\n            ]\n            prior_points = [\n                point\n                for point in prior_points\n                if (span := _parent_kind_at(point, regions)) is not None and span.kind == entity\n            ]\n    x = token.bbox.center_x\n    if target_points or prior_points:\n        target_near = _closeness(x, target_points, page.width) if target_points else 0.0\n        prior_near = _closeness(x, prior_points, page.width) if prior_points else 0.0\n        if prior_points and prior_near >= 0.65 and prior_near > target_near:\n            return "COMPARATIVE", period_end.year - 1\n        if target_points and target_near >= 0.65 and target_near > prior_near:\n            return "CURRENT", period_end.year\n        # Temporal evidence exists but does not prove which column owns the value.\n        return "UNKNOWN", period_end.year\n    # A genuinely single-column/no-comparative statement may rely on the page period.\n    return "CURRENT", period_end.year\n'''
          if old not in text:
              raise SystemExit('comparison role function not found')
          text = text.replace(old, new, 1)

          old = '''        comparison_role, header_year = _comparison_from_layout(\n            selected.page, selected.line, selected.token, period_end\n        )\n'''
          new = '''        comparison_role, header_year = _comparison_from_layout(\n            selected.page, selected.line, selected.token, period_end, entity=entity\n        )\n'''
          if old not in text:
              raise SystemExit('comparison role call not found')
          text = text.replace(old, new, 1)
          statement.write_text(text, encoding='utf-8')

          header = Path('src/cse_financial_etl/compiler/header_tree.py')
          h = header.read_text(encoding='utf-8')
          old = '    compiled = _assign_roles(compiled)\n'
          new = '    compiled = _assign_roles(\n        compiled, target_period_end=known.target_period_end if known is not None else None\n    )\n'
          if old not in h:
              raise SystemExit('header role call not found')
          h = h.replace(old, new, 1)

          old = '''def _assign_roles(columns: list[CompiledHeaderColumn]) -> list[CompiledHeaderColumn]:\n    groups: dict[tuple[Any, ...], list[CompiledHeaderColumn]] = {}\n    for col in columns:\n        if col.kind != "VALUE":\n            continue\n        groups.setdefault((col.entity, col.duration_months, col.temporal_type), []).append(col)\n    role_by_id: dict[str, str | None] = {}\n    for members in groups.values():\n        dated = [c for c in members if c.period_end is not None]\n        if not dated:\n            continue\n        latest = max(c.period_end for c in dated)  # type: ignore[type-var]\n        for col in members:\n            if col.period_end is None:\n                role_by_id[col.column_id] = None\n            elif col.period_end == latest:\n                role_by_id[col.column_id] = "CURRENT"\n            else:\n                role_by_id[col.column_id] = "COMPARATIVE"\n    return [_replace(c, comparison_role=role_by_id.get(c.column_id)) for c in columns]\n'''
          new = '''def _assign_roles(\n    columns: list[CompiledHeaderColumn], *, target_period_end: date | None = None\n) -> list[CompiledHeaderColumn]:\n    groups: dict[tuple[Any, ...], list[CompiledHeaderColumn]] = {}\n    for col in columns:\n        if col.kind != "VALUE":\n            continue\n        groups.setdefault((col.entity, col.duration_months, col.temporal_type), []).append(col)\n    role_by_id: dict[str, str | None] = {}\n    for members in groups.values():\n        dated = [c for c in members if c.period_end is not None]\n        if not dated:\n            continue\n        if target_period_end is not None:\n            # Known context is a validation target, not a value to copy into headers.\n            # It may, however, prevent a prior-only block from being promoted to\n            # CURRENT merely because it is the latest date the OCR managed to read.\n            for col in members:\n                if col.period_end is None:\n                    role_by_id[col.column_id] = None\n                elif col.period_end == target_period_end:\n                    role_by_id[col.column_id] = "CURRENT"\n                elif col.period_end < target_period_end:\n                    role_by_id[col.column_id] = "COMPARATIVE"\n                else:\n                    role_by_id[col.column_id] = None\n            continue\n        latest = max(c.period_end for c in dated)  # type: ignore[type-var]\n        for col in members:\n            if col.period_end is None:\n                role_by_id[col.column_id] = None\n            elif col.period_end == latest:\n                role_by_id[col.column_id] = "CURRENT"\n            else:\n                role_by_id[col.column_id] = "COMPARATIVE"\n    return [_replace(c, comparison_role=role_by_id.get(c.column_id)) for c in columns]\n'''
          if old not in h:
              raise SystemExit('header role function not found')
          h = h.replace(old, new, 1)
          header.write_text(h, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cse_financial_etl/extraction/statement_extractor.py src/cse_financial_etl/compiler/header_tree.py
          git commit -m "Fail closed on unresolved current versus comparative columns"
          git push origin HEAD:chatgpt/recalibrate-safe-baseline-20260910
