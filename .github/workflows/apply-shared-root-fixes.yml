name: Apply shared trust-chain root fixes

on:
  push:
    paths:
      - .github/workflows/apply-shared-root-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply generic trust-chain fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/cse_financial_etl/accounting/ontology.py",
              'r"^operating profit(?: before taxes? on financial services)?$",',
              'r"^operating profit(?: before tax(?:es)? on financial services)?$",',
          )

          replace_once(
              "src/cse_financial_etl/compiler/header_tree.py",
              "compiled = _assign_roles(compiled)",
              "compiled = _assign_roles(\n        compiled,\n        target_period_end=known.target_period_end if known is not None else None,\n    )",
          )
          replace_once(
              "src/cse_financial_etl/compiler/header_tree.py",
              "def _assign_roles(columns: list[CompiledHeaderColumn]) -> list[CompiledHeaderColumn]:",
              "def _assign_roles(\n    columns: list[CompiledHeaderColumn],\n    *,\n    target_period_end: date | None = None,\n) -> list[CompiledHeaderColumn]:",
          )
          replace_once(
              "src/cse_financial_etl/compiler/header_tree.py",
              '''    out: list[CompiledHeaderColumn] = []\n    for col in columns:\n        evidence = dict(col.evidence)\n        role_evidence = role_evidence_by_id.get(col.column_id)\n        if role_evidence is not None:\n            evidence["comparison_role"] = role_evidence\n        out.append(\n            _replace(\n                col,\n                comparison_role=role_by_id.get(col.column_id),\n                evidence=evidence,\n            )\n        )\n    return out\n''',
              '''    out: list[CompiledHeaderColumn] = []\n    for col in columns:\n        evidence = dict(col.evidence)\n        role = role_by_id.get(col.column_id)\n        role_evidence = role_evidence_by_id.get(col.column_id)\n\n        # Known target context may only *remove* a false CURRENT classification.\n        # It never creates CURRENT.  This protects prior-only OCR survivors from\n        # being promoted merely because they are the latest date still visible.\n        if (\n            target_period_end is not None\n            and role == "CURRENT"\n            and col.period_end is not None\n            and col.period_end != target_period_end\n        ):\n            if col.period_end < target_period_end:\n                role = "COMPARATIVE"\n                role_evidence = {\n                    "source": "known_context_negative_guard",\n                    "source_owned": False,\n                    "selected_date": col.period_end.isoformat(),\n                    "target_period_end": target_period_end.isoformat(),\n                    "role": "COMPARATIVE",\n                }\n            else:\n                role = None\n                role_evidence = None\n\n        if role_evidence is not None:\n            evidence["comparison_role"] = role_evidence\n        out.append(\n            _replace(\n                col,\n                comparison_role=role,\n                evidence=evidence,\n            )\n        )\n    return out\n''',
          )

          replace_once(
              "src/cse_financial_etl/facts/publisher.py",
              "    assert entry.entity is not None and entry.comparison_role is not None\n",
              "    # Entity is mandatory for every accepted source fact. Comparison role is\n    # mandatory only for exact-quarter FLOW concepts and is already enforced by\n    # the shared eligibility contract; AS_AT stock facts do not need a role.\n    assert entry.entity is not None\n",
          )

          replace_once(
              "src/cse_financial_etl/transformation/ratios.py",
              "from cse_financial_etl.extraction.statement_extractor import ExtractedFact\n",
              "from cse_financial_etl.accounting.concept_rules import requires_exact_3m\nfrom cse_financial_etl.extraction.statement_extractor import ExtractedFact\n",
          )
          replace_once(
              "src/cse_financial_etl/transformation/ratios.py",
              '''    if numerator.comparison_role != "CURRENT" or denominator.comparison_role != "CURRENT":\n        return _missing_ratio(template, ratio_code, "INCOMPATIBLE_PERIOD_CONTEXT", f"{ratio_code} requires CURRENT numerator and denominator facts.")\n''',
              '''    flow_inputs = [\n        fact\n        for fact in (numerator, denominator)\n        if requires_exact_3m(fact.metric_code)\n    ]\n    if any(\n        fact.comparison_role != "CURRENT" or fact.duration_months != 3\n        for fact in flow_inputs\n    ):\n        return _missing_ratio(\n            template,\n            ratio_code,\n            "INCOMPATIBLE_PERIOD_CONTEXT",\n            f"{ratio_code} requires CURRENT three-month context for FLOW inputs; AS_AT stock inputs are bound by target period.",\n        )\n''',
          )

          replace_once(
              "tests/unit/test_pipeline_gaps.py",
              '''        status="EXTRACTED",\n        duration_months=duration,\n''',
              '''        status="EXTRACTED",\n        comparison_role="CURRENT",\n        duration_months=duration,\n''',
          )
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-shared-root-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix period ownership and ratio context at source"
          git push origin HEAD:main
