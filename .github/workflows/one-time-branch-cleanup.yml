name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort -u)
          for branch in "${branches[@]}"; do
            if [[ -z "$branch" || "$branch" == "main" || "$branch" == "HEAD" ]]; then
              continue
            fi
            echo "Deleting remote branch: $branch"
            git push origin --delete "$branch"
          done

      - name: Verify only main remains
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          remaining=$(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -vE '^(main|HEAD)$' || true)
          if [[ -n "$remaining" ]]; then
            echo "Unexpected branches remain:"
            echo "$remaining"
            exit 1
          fi
          echo "Branch cleanup complete: only main remains."
