name: Deterministic production checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check src
      - run: uv run mypy src
      - run: uv run pytest --junitxml=outputs/tests.xml
      - name: Six real PDFs are mandatory
        env:
          CSE_REQUIRE_FIXTURES: '1'
        run: uv run pytest tests/regression/redesign/test_compiler_real_pdfs.py --junitxml=outputs/source-acceptance.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: outputs/*.xml
