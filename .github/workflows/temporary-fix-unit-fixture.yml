name: Temporary unit fixture repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Apply explicit comparative header to unit fixture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Repair fixture and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/regression/test_structure_benchmark.py')
          text = path.read_text(encoding='utf-8')
          old = '''        "For the three months ended 30 June 2025\\n"\n        "Rs.'000\\n"\n        "Revenue 1,000 900\\n"\n        "Profit for the period 250 180\\n",'''
          new = '''        "For the three months ended 30 June 2025\\n"\n        "30 June 2025 30 June 2024\\n"\n        "Rs.'000\\n"\n        "Revenue 1,000 900\\n"\n        "Profit for the period 250 180\\n",'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact fixture block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/temporary-fix-unit-fixture.yml').unlink()
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/regression/test_structure_benchmark.py .github/workflows/temporary-fix-unit-fixture.yml
          git commit -m "Make unit inheritance fixture period-explicit"
          git push origin HEAD:main
