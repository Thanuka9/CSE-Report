name: Apply source-owned comparison-role hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.11'
          python-version: '3.12'
      - name: Harden source ownership and publisher typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          header_path = Path("src/cse_financial_etl/compiler/header_tree.py")
          text = header_path.read_text(encoding="utf-8")

          old_call = '''    compiled = _assign_roles(\n        compiled,\n        target_period_end=known.target_period_end if known is not None else None,\n    )'''
          new_call = '''    compiled = _assign_roles(compiled)'''
          if old_call not in text:
              raise SystemExit("expected _assign_roles call not found")
          text = text.replace(old_call, new_call, 1)

          start = text.index("def _assign_roles(\n")
          end = text.index("\n\ndef _period_starts(", start)
          replacement = '''def _assign_roles(columns: list[CompiledHeaderColumn]) -> list[CompiledHeaderColumn]:
              """Derive CURRENT/COMPARATIVE only from source-owned header dates.

              Query/target context is deliberately absent. Every sibling VALUE
              column in a multi-column source block must have a parsed date before
              roles are inferred; otherwise all roles in that block remain unknown.
              """

              groups: dict[tuple[Any, ...], list[CompiledHeaderColumn]] = {}
              for col in columns:
                  if col.kind != "VALUE":
                      continue
                  groups.setdefault((col.entity, col.duration_months, col.temporal_type), []).append(col)

              role_by_id: dict[str, str | None] = {}
              role_evidence_by_id: dict[str, dict[str, Any]] = {}
              for members in groups.values():
                  dated = [c for c in members if c.period_end is not None]
                  if not dated:
                      continue
                  if len(members) > 1 and len(dated) != len(members):
                      for col in members:
                          role_by_id[col.column_id] = None
                      continue

                  observed_date_values = [c.period_end for c in dated if c.period_end is not None]
                  latest = max(observed_date_values)
                  observed_dates = sorted({value.isoformat() for value in observed_date_values})
                  for col in members:
                      if col.period_end is None:
                          role_by_id[col.column_id] = None
                          continue
                      role = "CURRENT" if col.period_end == latest else "COMPARATIVE"
                      role_by_id[col.column_id] = role
                      role_evidence_by_id[col.column_id] = {
                          "source": "source_header_date_order",
                          "source_owned": True,
                          "observed_dates": observed_dates,
                          "selected_date": col.period_end.isoformat(),
                          "role": role,
                      }

              out: list[CompiledHeaderColumn] = []
              for col in columns:
                  evidence = dict(col.evidence)
                  role: str | None = role_by_id.get(col.column_id)
                  role_evidence = role_evidence_by_id.get(col.column_id)
                  if role_evidence is not None:
                      evidence["comparison_role"] = role_evidence
                  out.append(_replace(col, comparison_role=role, evidence=evidence))
              return out
          '''
          # The triple-quoted block above is indented inside this script. Normalize it.
          import textwrap
          replacement = textwrap.dedent(replacement).rstrip()
          text = text[:start] + replacement + text[end:]
          header_path.write_text(text, encoding="utf-8")

          publisher_path = Path("src/cse_financial_etl/facts/publisher.py")
          publisher = publisher_path.read_text(encoding="utf-8")
          old_publisher = "        comparison_role=entry.comparison_role,"
          new_publisher = '        comparison_role=entry.comparison_role or "UNKNOWN",'
          if old_publisher not in publisher:
              raise SystemExit("expected publisher comparison_role assignment not found")
          publisher_path.write_text(publisher.replace(old_publisher, new_publisher, 1), encoding="utf-8")

          test_path = Path("tests/unit/redesign/test_header_tree.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_single_source_column_role_is_query_invariant() -> None:"
          if marker not in tests:
              tests += '''\n\ndef test_single_source_column_role_is_query_invariant() -> None:\n    page = make_page(\n        [\n            [*words("Statement of profit or loss - Company", 40)],\n            [*words("For the three months ended 30 June 2026", 300)],\n            [("30.06.2026", 300, 340)],\n            [*words("Revenue", 40), right_aligned("100", C1_X)],\n            [*words("Profit for the period", 40), right_aligned("10", C1_X)],\n        ]\n    )\n    known_matching = build_known_context(\n        issuer_name="X PLC", symbol="X.N0000", period_end=date(2026, 6, 30), required_entity="COMPANY"\n    )\n    known_other = build_known_context(\n        issuer_name="X PLC", symbol="X.N0000", period_end=date(2027, 6, 30), required_entity="COMPANY"\n    )\n    matching = _cols(_compile(page, known=known_matching))\n    other = _cols(_compile(page, known=known_other))\n    assert matching[1].period_end == other[1].period_end == date(2026, 6, 30)\n    assert matching[1].comparison_role == other[1].comparison_role == "CURRENT"\n    assert matching[1].evidence["comparison_role"]["source_owned"] is True\n    assert other[1].evidence["comparison_role"]["source_owned"] is True\n'''
              test_path.write_text(tests, encoding="utf-8")
          PY
      - run: uv sync --locked --group dev
      - run: uv run ruff check src/cse_financial_etl/compiler/header_tree.py src/cse_financial_etl/facts/publisher.py tests/unit/redesign/test_header_tree.py
      - run: uv run mypy src
      - run: uv run pytest tests/unit/redesign/test_header_tree.py
      - name: Commit hardened source and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-source-owned-role-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make comparison roles fully source-owned"
          git push origin main
