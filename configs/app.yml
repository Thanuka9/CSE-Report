environment: development
data_dir: data
output_dir: outputs
current_facts_path: data/gold/current_financial_facts.parquet
current_prices_path: data/gold/current_market_prices.parquet
evidence_root: data/silver/evidence
http:
  timeout_seconds: 30
  max_retries: 3
  requests_per_second: 0.5
  max_file_bytes: 52428800
extraction:
  auto_approve_threshold: 0.95
  manual_review_threshold: 0.80
  ocr_enabled: true
  use_transformer: false
  semantic_model: rapidfuzz-token-set
  keep_review_diagnostics: true
  # DRAFT production cutover 2026-09-22. V1 remains the rollback backend.
  # OFFICIAL publication is not human-certified. AI QA is a dossier, not MANUAL_QA.
  engine: v2
publication:
  # DRAFT: validated-but-unreviewed candidates are displayed and every artefact
  # (workbook, dashboard, manifest) is labelled DRAFT. OFFICIAL: only facts with an
  # authenticated reviewer approval in data/review/review_decisions.jsonl publish.
  # OFFICIAL remains blocked until humans sign MANUAL_QA gold and the 8,924
  # APPROVED/CURATED floor is met. AI/evidence precheck does not count as MANUAL_QA.
  release_mode: DRAFT
  price_staleness_max_days: 7
reporting:
  rolling_period_count: 3
  currency: LKR
  rank_change_formula: previous_minus_current
