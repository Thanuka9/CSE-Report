environment: development
data_dir: data
output_dir: outputs
current_facts_path: data/gold/current_financial_facts.parquet
current_prices_path: data/gold/current_market_prices.parquet
evidence_root: data/silver/evidence
http:
  timeout_seconds: 30
  max_retries: 3
  requests_per_second: 0.5
  max_file_bytes: 52428800
extraction:
  auto_approve_threshold: 0.95
  manual_review_threshold: 0.80
  ocr_enabled: true
  use_transformer: false
  semantic_model: rapidfuzz-token-set
  keep_review_diagnostics: true
reporting:
  rolling_period_count: 3
  currency: LKR
  rank_change_formula: previous_minus_current
